<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Xem mô hình 3D</title>
  <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/4.3.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #menu { padding: 10px; background: #f5f5f5; display: flex; flex-wrap: wrap; gap: 10px; }
    #menu label, #menu a {
      padding: 6px 12px; background: #fff; border: 1px solid #ccc;
      border-radius: 6px; cursor: pointer; user-select: none; text-decoration: none; color: #333;
    }
    model-viewer { width: 100%; height: 85vh; background: #eee; }
    #danhSachDuAn { padding: 20px; }
    #danhSachDuAn a { display: block; margin: 8px 0; font-size: 18px; }
  </style>
</head>
<body>

  <div id="menu" style="display:none;"></div>
  <model-viewer 
    id="viewer" 
    alt="Mô hình 3D" 
    auto-rotate 
    camera-controls 
    ar
    min-camera-orbit="auto auto 0.1m"
    min-field-of-view="5deg"
    bounds="tight">
  </model-viewer>
  <div id="danhSachDuAn"></div>

  <script>
    const OWNER = "hiepsitemple";
    const REPO = "my-3d-viewer";
    const KHOANG_CACH = 2;

    const params = new URLSearchParams(window.location.search);
    const duAn = params.get('project');

    if (duAn) {
      hienThiModel(duAn);
    } else {
      hienThiDanhSachDuAn();
    }

    // ----- Trang chủ: liệt kê danh sách dự án -----
    async function hienThiDanhSachDuAn() {
      const el = document.getElementById('danhSachDuAn');
      el.innerHTML = "Đang tải danh sách dự án...";
      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/projects`);
        const items = await res.json();
        const thuMuc = items.filter(i => i.type === 'dir');

        el.innerHTML = "<h2>Danh sách dự án</h2>";
        thuMuc.forEach(folder => {
          const a = document.createElement('a');
          a.href = `?project=${folder.name}`;
          a.textContent = folder.name;
          el.appendChild(a);
        });

        if (thuMuc.length === 0) el.innerHTML += "Chưa có dự án nào trong thư mục projects.";
      } catch (e) {
        el.textContent = "Không tải được danh sách dự án.";
      }
    }

    // ----- Trang xem model của 1 dự án cụ thể -----
    async function hienThiModel(duAn) {
      document.getElementById('menu').style.display = 'flex';
      document.getElementById('viewer').style.display = 'block';
      const menu = document.getElementById('menu');
      menu.innerHTML = `<a href="./">← Về danh sách dự án</a>`;

      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/projects/${duAn}`);
        const files = await res.json();
        const glbFiles = files.filter(f => f.name.toLowerCase().endsWith('.glb'));

        glbFiles.forEach((file, index) => {
          const label = document.createElement('label');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.value = file.download_url;
          checkbox.onchange = capNhatScene;
          if (index === 0) checkbox.checked = true;
          label.appendChild(checkbox);
          label.append(' ' + file.name.replace('.glb', ''));
          menu.appendChild(label);
        });

        if (glbFiles.length === 0) menu.innerHTML += "Chưa có model .glb nào trong dự án này.";
        capNhatScene();
      } catch (e) {
        menu.innerHTML += "Không tải được model. Kiểm tra lại tên dự án.";
      }
    }

    function capNhatScene() {
      const daChon = [...document.querySelectorAll('#menu input:checked')].map(cb => cb.value);
      const viewer = document.getElementById('viewer');
      viewer.querySelectorAll('extra-model').forEach(el => el.remove());

      if (daChon.length === 0) { viewer.removeAttribute('src'); return; }

      viewer.src = daChon[0];
      for (let i = 1; i < daChon.length; i++) {
        const extra = document.createElement('extra-model');
        extra.setAttribute('src', daChon[i]);
        extra.setAttribute('offset', `${KHOANG_CACH * i}m 0 0`);
        viewer.appendChild(extra);
      }
    }
  </script>

</body>
</html>
